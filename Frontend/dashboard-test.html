<!DOCTYPE html>

<html class="dark" lang="vi"><head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>TechNova Admin Dashboard</title>
    <!-- Tailwind CSS -->
    <script
      src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <!-- Tailwind Configuration -->
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-error": "#690005",
                        "on-surface-variant": "#c2c6d8",
                        "on-tertiary-fixed": "#390c00",
                        "surface-container-lowest": "#0e0e10",
                        "tertiary-fixed-dim": "#ffb59d",
                        "surface": "#131315",
                        "on-tertiary": "#5d1900",
                        "primary-fixed-dim": "#b3c5ff",
                        "tertiary": "#ffb59d",
                        "on-secondary-fixed-variant": "#8c1800",
                        "on-background": "#e5e1e4",
                        "surface-dim": "#131315",
                        "surface-container": "#201f22",
                        "secondary": "#ffb4a4",
                        "on-primary-container": "#f8f7ff",
                        "on-error-container": "#ffdad6",
                        "outline-variant": "#424656",
                        "on-surface": "#e5e1e4",
                        "on-secondary-fixed": "#3d0600",
                        "tertiary-container": "#cc4204",
                        "on-tertiary-container": "#fff6f4",
                        "inverse-surface": "#e5e1e4",
                        "flash-sale-red": "#EF4444",
                        "secondary-fixed": "#ffdad3",
                        "background": "#131315",
                        "secondary-fixed-dim": "#ffb4a4",
                        "surface-container-high": "#2a2a2c",
                        "on-tertiary-fixed-variant": "#832600",
                        "outline": "#8c90a1",
                        "tertiary-fixed": "#ffdbd0",
                        "inverse-on-surface": "#313032",
                        "on-secondary": "#630e00",
                        "surface-variant": "#353437",
                        "error-container": "#93000a",
                        "surface-tint": "#b3c5ff",
                        "secondary-container": "#b72301",
                        "zinc-400": "#a1a1aa",
                        "on-secondary-container": "#ffcdc2",
                        "surface-container-low": "#1c1b1d",
                        "slate-900": "#0f172a",
                        "primary": "#b3c5ff",
                        "on-primary": "#002b75",
                        "inverse-primary": "#0054d6",
                        "on-primary-fixed-variant": "#003fa4",
                        "surface-container-highest": "#353437",
                        "on-primary-fixed": "#001849",
                        "error": "#ffb4ab",
                        "primary-fixed": "#dae1ff",
                        "primary-container": "#0066ff",
                        "zinc-800": "#27272a",
                        "surface-bright": "#39393b"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "gutter": "1.5rem",
                        "section-gap-sm": "3rem",
                        "grid-bento-gap": "1rem",
                        "section-gap-lg": "6rem",
                        "container-max": "1400px"
                    },
                    "fontFamily": {
                        "label-mono": ["Geist"],
                        "body-base": ["Geist"],
                        "body-sm": ["Geist"],
                        "headline-md": ["Be Vietnam Pro"],
                        "headline-lg": ["Be Vietnam Pro"],
                        "price-display": ["Geist"],
                        "hero-xl": ["Be Vietnam Pro"],
                        "hero-xl-mobile": ["Be Vietnam Pro"]
                    },
                    "fontSize": {
                        "label-mono": ["11px", { "lineHeight": "1.0", "letterSpacing": "0.2em", "fontWeight": "500" }],
                        "body-base": ["16px", { "lineHeight": "1.6", "fontWeight": "400" }],
                        "body-sm": ["14px", { "lineHeight": "1.5", "fontWeight": "400" }],
                        "headline-md": ["32px", { "lineHeight": "1.3", "fontWeight": "700" }],
                        "headline-lg": ["48px", { "lineHeight": "1.2", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "price-display": ["24px", { "lineHeight": "1.0", "fontWeight": "600" }],
                        "hero-xl": ["72px", { "lineHeight": "1.1", "letterSpacing": "-0.04em", "fontWeight": "800" }],
                        "hero-xl-mobile": ["40px", { "lineHeight": "1.2", "letterSpacing": "-0.02em", "fontWeight": "800" }]
                    }
                }
            }
        }
    </script>
    <!-- Material Symbols -->
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
      rel="stylesheet" />
    <!-- Google Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;800&amp;family=Geist:wght@400;500;600&amp;display=swap"
      rel="stylesheet" />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
      rel="stylesheet" />
    <style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;
        }
        .material-symbols-outlined.fill {
            font-variation-settings: 'FILL' 1;
        }
        body {
            background-color: theme('colors.background');
            color: theme('colors.on-background');
        }
        
        /* Custom Scrollbar for modern look */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: theme('colors.surface');
        }
        ::-webkit-scrollbar-thumb {
            background: theme('colors.outline-variant');
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: theme('colors.outline');
        }
    </style>
  </head>
  <body class="font-body-base bg-background text-on-background min-h-screen">
    <!-- App Shell Container -->
    <div class="flex h-screen overflow-hidden">
      <!-- SideNavBar -->
      <div id="admin-sidebar-placeholder" class="contents"></div>
      <!-- Main Content Area -->
      <div class="flex-1 ml-72 flex flex-col min-h-screen">
        <!-- TopNavBar -->
        <div id="admin-header-placeholder" class="contents"></div>
        <!-- Dashboard Content -->
        <main class="flex-1 mt-16 p-8 overflow-y-auto bg-background">

        </main>
      </div>
    </div>
  </body>
  <script src="assets/js/common.js"></script></html>
