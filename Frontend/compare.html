<!DOCTYPE html>
<html class="light hide-scrollbar" lang="vi" style>
    <head>
        <meta charset="utf-8" />
        <meta content="width=device-width, initial-scale=1.0"
            name="viewport" />
        <title>TechNova | Kỷ Nguyên Công Nghệ Mới</title>
        <link rel="icon" href="data:,">
        <link href="https://fonts.googleapis.com" rel="preconnect" />
        <link crossorigin href="https://fonts.gstatic.com"
            rel="preconnect" />
        <link
            href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:ital,wght@0,400..700;1,400..700&family=Geist:wght@100..900&family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap"
            rel="stylesheet" />
        <link
            href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
            rel="stylesheet" />
        <script
            src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
        <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-container-highest": "#e0e3e2",
                        "inverse-primary": "#c1c8c3",
                        "on-tertiary-fixed-variant": "#93001b",
                        "on-surface": "#181c1c",
                        "graphite": "#606562",
                        "inverse-surface": "#2d3131",
                        "on-primary-fixed-variant": "#414845",
                        "surface-variant": "#e0e3e2",
                        "on-surface-variant": "#434845",
                        "on-secondary-fixed-variant": "#454747",
                        "error-container": "#ffdad6",
                        "secondary-fixed-dim": "#c6c6c7",
                        "primary-container": "#1a211e",
                        "on-error": "#ffffff",
                        "carbon-ink": "#1a211e",
                        "on-primary-fixed": "#161d1a",
                        "mist": "#e0e0e0",
                        "ember-red": "#cc2e39",
                        "tertiary": "#190001",
                        "outline": "#747875",
                        "surface-container-high": "#e6e9e8",
                        "on-secondary": "#ffffff",
                        "error": "#ba1a1a",
                        "background": "#f7faf9",
                        "on-secondary-container": "#616363",
                        "on-error-container": "#93000a",
                        "on-tertiary-container": "#f14a50",
                        "paper-white": "#ffffff",
                        "on-background": "#181c1c",
                        "fog": "#eef1f0",
                        "obsidian": "#0c0c0c",
                        "inverse-on-surface": "#eef1f0",
                        "surface-tint": "#59605c",
                        "surface-container-low": "#f1f4f3",
                        "secondary-fixed": "#e2e2e2",
                        "primary": "#030806",
                        "primary-fixed-dim": "#c1c8c3",
                        "surface-container": "#ebeeed",
                        "secondary-container": "#dfe0e0",
                        "on-tertiary-fixed": "#410006",
                        "surface-container-lowest": "#ffffff",
                        "tertiary-fixed-dim": "#ffb3b0",
                        "surface-dim": "#d7dbda",
                        "on-tertiary": "#ffffff",
                        "true-black": "#000000",
                        "surface-bright": "#f7faf9",
                        "primary-fixed": "#dde4df",
                        "tertiary-fixed": "#ffdad8",
                        "tertiary-container": "#480008",
                        "on-primary-container": "#818984",
                        "on-secondary-fixed": "#1a1c1c",
                        "secondary": "#5d5f5f",
                        "surface": "#f7faf9",
                        "ash-border": "#cccfcd",
                        "outline-variant": "#c3c7c4",
                        "on-primary": "#ffffff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "spacing": {
                        "base": "4px",
                        "xxl": "80px",
                        "container-max": "1440px",
                        "xl": "64px",
                        "lg": "24px",
                        "gutter": "24px",
                        "md": "12px",
                        "xs": "4px",
                        "sm": "8px"
                    },
                    "fontFamily": {
                        "headline-lg": ["Playfair Display", "serif"],
                        "headline-lg-mobile": ["Playfair Display", "serif"],
                        "label-sm": ["Archivo Narrow", "sans-serif"],
                        "display-xl": ["Playfair Display", "serif"],
                        "label-caps": ["Archivo Narrow", "sans-serif"],

                        "label-sm": ["14px", { "lineHeight": "1.1", "letterSpacing": "0.04em", "fontWeight": "700" }],
                        "display-xl": ["80px", { "lineHeight": "1.1", "letterSpacing": "-0.025em", "fontWeight": "400" }],
                        "label-caps": ["16px", { "lineHeight": "1.1", "letterSpacing": "0.05em", "fontWeight": "700" }],
                        "headline-md": ["32px", { "lineHeight": "1.2", "fontWeight": "400" }],
                        "technical-mono": ["14px", { "lineHeight": "1.0", "fontWeight": "400" }],
                        "body-sm": ["14px", { "lineHeight": "1.4", "fontWeight": "400" }],
                        "body-lg": ["16px", { "lineHeight": "1.5", "fontWeight": "400" }],
                        "body-dm": ["14px", { "lineHeight": "1.1", "letterSpacing": "0.05em", "fontWeight": "700" }],

                }
            }
        }
        </script>
        <style type="text/tailwindcss">
        @layer utilities {
            .hide-scrollbar::-webkit-scrollbar {
                display: none;
            }
            .hide-scrollbar {
                -ms-overflow-style: none;
                scrollbar-width: none;
            }
        }
        </style>
    </head>
    <body
        class="bg-background text-on-background font-body-lg antialiased pt-28">
        <div id="header-placeholder"></div>
        <main class="max-w-container-max mx-auto px-lg py-xl">
            <div class="mb-8">
                <a
                    class="flex items-center gap-2 text-on-surface-variant hover:text-primary transition-colors font-body-sm mb-4 group"
                    href="products.html">
                    <span
                        class="material-symbols-outlined text-[20px] transition-transform group-hover:-translate-x-1">arrow_back</span>
                    <span>Quay lại</span>
                </a>
                <h1
                    class="font-headline-lg text-headline-lg italic text-on-surface mb-2">So
                    sánh cấu hình</h1>
                <p
                    class="font-body-base text-body-base text-on-surface-variant">So
                    sánh chi tiết các dòng laptop gaming cao cấp để tìm ra cỗ
                    máy phù hợp nhất với bạn.</p>
            </div>

            <!-- Vùng hiển thị khi KHÔNG CÓ dữ liệu so sánh -->
            <div id="no-compare-data"
                class="hidden text-center py-xxl bg-surface-container-lowest border border-mist rounded-lg">
                <span
                    class="material-symbols-outlined text-[48px] text-graphite mb-4">devices</span>
                <p class="font-body-sm text-graphite mb-lg">Bạn chưa chọn sản
                    phẩm nào để so sánh. Hãy quay lại trang cửa hàng nhé!</p>
                <a href="products.html"
                    class="inline-block bg-carbon-ink text-paper-white py-md px-lg font-body-lg text-label-caps uppercase rounded hover:bg-obsidian transition-colors">
                    Khám phá sản phẩm
                </a>
            </div>

            <div id="compare-main-container">
                <!-- SỬA Ở ĐÂY: Thay md:grid-cols-4 thành md:grid-cols-[220px_repeat(3,1fr)] -->
                <div id="compare-header-row"
                    class="grid grid-cols-1 md:grid-cols-[220px_repeat(3,1fr)] gap-gutter mb-lg border-b border-mist pb-lg">
                    <!-- JS sẽ đổ danh sách hình ảnh và tên máy vào đây -->
                </div>

                <!-- Technical Matrix Grid -->
                <div id="compare-body"
                    class="flex flex-col border border-mist rounded-lg overflow-hidden">
                    <!-- JS sẽ đổ các hàng thông số (Chip, RAM, Giá...) vào đây -->
                </div>
            </div>
        </main>

        <!-- Footer -->
        <div id="footer-placeholder"></div>
        <!-- Modal Tìm Kiếm Sản Phẩm (Chuẩn Peak Design) -->
        <div id="compare-search-modal"
            class="hidden fixed inset-0 z-[70] flex items-center justify-center bg-obsidian/60 backdrop-blur-sm px-4">

            <!-- Khung Modal: Nền Paper White, Viền hairline Mist, Không đổ bóng, Bo góc 4px -->
            <div
                class="bg-paper-white w-full max-w-2xl border border-mist rounded-[4px] flex flex-col max-h-[80vh] shadow-none overflow-hidden">

                <!-- Tiêu đề Modal -->
                <div
                    class="p-lg border-b border-mist flex justify-between items-center relative">
                    <h2
                        class="font-headline-lg text-[32px] italic text-carbon-ink ">Tìm
                        kiếm sản phẩm</h2>
                    <button onclick="closeCompareSearch()"
                        class="text-graphite hover:text-carbon-ink transition-colors bg-transparent border-none outline-none">
                        <span
                            class="material-symbols-outlined text-[24px]">close</span>
                    </button>
                </div>

                <!-- Khu vực Ô nhập liệu (Search Field) -->
                <div class="p-lg border-b border-mist bg-surface-bright">
                    <div class="relative w-full">
                        <span
                            class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-graphite text-[20px]">search</span>
                        <!-- Input chuẩn Peak: Nền Fog, viền Ash Border, chữ Geist, góc 4px -->
                        <input type="text" id="compare-search-input"
                            onkeyup="debounceCompareSearch(event)"
                            class="w-full bg-fog border border-ash-border rounded-[4px] py-3 pl-10 pr-4 font-body-lg text-[16px] text-carbon-ink placeholder:text-graphite focus:outline-none focus:border-carbon-ink transition-colors shadow-none"
                            placeholder="Gõ tên sản phẩm để tìm kiếm...">
                    </div>
                </div>

                <!-- Khu vực hiển thị kết quả -->
                <div id="compare-search-results"
                    class="p-lg overflow-y-auto flex-1 hide-scrollbar flex flex-col gap-4">
                    <!-- JS sẽ đổ dữ liệu vào đây -->
                </div>
            </div>

        </div>
    </body>
    <script src="assets/js/common.js"></script>
    <script src="assets/js/compare.js"></script>
</html>
