<!DOCTYPE html>
<html class="light hide-scrollbar" lang="vi" style>
        <head>
                <meta charset="utf-8" />
                <meta content="width=device-width, initial-scale=1.0"
                        name="viewport" />
                <title>TechNova | Kỷ Nguyên Công Nghệ Mới</title>
                <link rel="icon" href="data:,">
                <link href="https://fonts.googleapis.com" rel="preconnect" />
                <link crossorigin href="https://fonts.gstatic.com"
                        rel="preconnect" />
                <link
                        href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:ital,wght@0,400..700;1,400..700&family=Geist:wght@100..900&family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap"
                        rel="stylesheet" />
                <link
                        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
                        rel="stylesheet" />
                <script
                        src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
                <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-container-highest": "#e0e3e2",
                        "inverse-primary": "#c1c8c3",
                        "on-tertiary-fixed-variant": "#93001b",
                        "on-surface": "#181c1c",
                        "graphite": "#606562",
                        "inverse-surface": "#2d3131",
                        "on-primary-fixed-variant": "#414845",
                        "surface-variant": "#e0e3e2",
                        "on-surface-variant": "#434845",
                        "on-secondary-fixed-variant": "#454747",
                        "error-container": "#ffdad6",
                        "secondary-fixed-dim": "#c6c6c7",
                        "primary-container": "#1a211e",
                        "on-error": "#ffffff",
                        "carbon-ink": "#1a211e",
                        "on-primary-fixed": "#161d1a",
                        "mist": "#e0e0e0",
                        "ember-red": "#cc2e39",
                        "tertiary": "#190001",
                        "outline": "#747875",
                        "surface-container-high": "#e6e9e8",
                        "on-secondary": "#ffffff",
                        "error": "#ba1a1a",
                        "background": "#f7faf9",
                        "on-secondary-container": "#616363",
                        "on-error-container": "#93000a",
                        "on-tertiary-container": "#f14a50",
                        "paper-white": "#ffffff",
                        "on-background": "#181c1c",
                        "fog": "#eef1f0",
                        "obsidian": "#0c0c0c",
                        "inverse-on-surface": "#eef1f0",
                        "surface-tint": "#59605c",
                        "surface-container-low": "#f1f4f3",
                        "secondary-fixed": "#e2e2e2",
                        "primary": "#030806",
                        "primary-fixed-dim": "#c1c8c3",
                        "surface-container": "#ebeeed",
                        "secondary-container": "#dfe0e0",
                        "on-tertiary-fixed": "#410006",
                        "surface-container-lowest": "#ffffff",
                        "tertiary-fixed-dim": "#ffb3b0",
                        "surface-dim": "#d7dbda",
                        "on-tertiary": "#ffffff",
                        "true-black": "#000000",
                        "surface-bright": "#f7faf9",
                        "primary-fixed": "#dde4df",
                        "tertiary-fixed": "#ffdad8",
                        "tertiary-container": "#480008",
                        "on-primary-container": "#818984",
                        "on-secondary-fixed": "#1a1c1c",
                        "secondary": "#5d5f5f",
                        "surface": "#f7faf9",
                        "ash-border": "#cccfcd",
                        "outline-variant": "#c3c7c4",
                        "on-primary": "#ffffff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "spacing": {
                        "base": "4px",
                        "xxl": "80px",
                        "container-max": "1440px",
                        "xl": "64px",
                        "lg": "24px",
                        "gutter": "24px",
                        "md": "12px",
                        "xs": "4px",
                        "sm": "8px"
                    },
                    "fontFamily": {
                        "headline-lg": ["Playfair Display", "serif"],
                        "headline-lg-mobile": ["Playfair Display", "serif"],
                        "label-sm": ["Archivo Narrow", "sans-serif"],

                        "label-caps": ["Archivo Narrow", "sans-serif"],

                        "label-sm": ["14px", { "lineHeight": "1.1", "letterSpacing": "0.04em", "fontWeight": "700" }],
                        "display-xl": ["80px", { "lineHeight": "1.1", "letterSpacing": "-0.025em", "fontWeight": "400" }],
                        "label-caps": ["16px", { "lineHeight": "1.1", "letterSpacing": "0.05em", "fontWeight": "700" }],
                        "headline-md": ["32px", { "lineHeight": "1.2", "fontWeight": "400" }],
                        "technical-mono": ["14px", { "lineHeight": "1.0", "fontWeight": "400" }],
                        "body-sm": ["14px", { "lineHeight": "1.4", "fontWeight": "400" }],
                        "body-lg": ["16px", { "lineHeight": "1.5", "fontWeight": "400" }],
                        "body-dm": ["14px", { "lineHeight": "1.1", "letterSpacing": "0.05em", "fontWeight": "700" }],

                }

        }
        </script>
                <style type="text/tailwindcss">
        @layer utilities {
            .hide-scrollbar::-webkit-scrollbar {
                display: none;
            }
            .hide-scrollbar {
                -ms-overflow-style: none;
                scrollbar-width: none;
            }
        }
        </style>
        </head>
        <body
                class="bg-background text-on-background font-body-lg antialiased pt-28">
                <div id="header-placeholder"></div>
                <div class="flex max-w-[1440px] mx-auto ">
                        <div id="sidebar-placeholder"
                                class="w-full md:w-64 flex-shrink-0"></div>

                        <main
                                class="flex-1 p-8 md:p-12 bg-paper-white"><!-- Status Tabs -->
                                <div
                                        class="flex items-center gap-8 hairline-b mb-8 overflow-x-auto pb-1">
                                        <!-- Nút "Tất cả" mặc định được chọn -->
                                        <button
                                                onclick="changeOrderTab('ALL', this)"
                                                class="pb-4 text-body-lg font-body-lg font-medium text-graphite hover:text-carbon-ink transition-colors whitespace-nowrap">Tất
                                                cả</button>
                                        <button
                                                onclick="changeOrderTab('PENDING', this)"
                                                class="pb-1 text-body-lg font-body-lg font-bold text-primary border-b-2 border-primary whitespace-nowrap">Chờ
                                                xác nhận</button>
                                        <button
                                                onclick="changeOrderTab('CONFIRMED', this)"
                                                class="pb-4 text-body-lg font-body-lg font-medium text-graphite hover:text-carbon-ink transition-colors whitespace-nowrap">Đã
                                                xác nhận</button>
                                        <button
                                                onclick="changeOrderTab('SHIPPING', this)"
                                                class="pb-4 text-body-lg font-body-lg font-medium text-graphite hover:text-carbon-ink transition-colors whitespace-nowrap">Đang
                                                vận chuyển</button>
                                        <button
                                                onclick="changeOrderTab('DELIVERED', this)"
                                                class="pb-4 text-body-lg font-body-lg font-medium text-graphite hover:text-carbon-ink transition-colors whitespace-nowrap">Hoàn
                                                thành</button>
                                        <button
                                                onclick="changeOrderTab('CANCELLED', this)"
                                                class="pb-4 text-body-lg font-body-lg font-medium text-graphite hover:text-carbon-ink transition-colors whitespace-nowrap">Đã
                                                hủy</button>
                                </div>

                                <!-- Order List Container -->
                                <!-- CỰC KỲ QUAN TRỌNG: Gắn id="orders-container" vào đây -->
                                <div id="orders-container"
                                        class="flex flex-col gap-6">
                                        <!-- Rỗng! Các thẻ đơn hàng cũ đã được xóa. JavaScript sẽ tự động chèn mã HTML của các đơn hàng vào đây -->
                                </div></main>
                </div>
                <!-- ==================== MODAL TRẢ HÀNG / HOÀN TIỀN ==================== -->
                <div id="return-modal"
                        class="hidden fixed inset-0 z-50 flex items-center justify-center bg-obsidian/50 backdrop-blur-sm transition-opacity">
                        <div
                                class="bg-paper-white rounded-xl shadow-2xl w-full max-w-md p-6 relative">
                                <!-- Nút Đóng -->
                                <button onclick="closeReturnModal()"
                                        class="absolute top-4 right-4 text-graphite hover:text-carbon-ink transition-colors">
                                        <span
                                                class="material-symbols-outlined">close</span>
                                </button>

                                <h3
                                        class="text-xl font-headline-md font-medium text-carbon-ink border-b border-mist pb-3 mb-4">Yêu
                                        cầu Trả hàng / Hoàn tiền</h3>

                                <!-- Thông tin sản phẩm thu gọn sẽ được JS chèn vào đây -->
                                <div id="return-product-info"
                                        class="flex items-center gap-3 bg-surface-container-low p-3 rounded-lg mb-4">
                                        <!-- Dữ liệu JS sẽ đổ vào đây -->
                                </div>

                                <!-- Form nhập lý do -->
                                <div class="mb-4">
                                        <label for="return-reason"
                                                class="block text-body-sm font-bold text-carbon-ink mb-2">Lý
                                                do trả hàng <span
                                                        class="text-ember-red">*</span></label>
                                        <textarea id="return-reason" rows="3"
                                                class="w-full px-3 py-2 border border-outline-variant rounded-lg focus:outline-none focus:ring-1 focus:ring-primary focus:border-primary text-body-sm text-carbon-ink resize-none bg-surface-bright"
                                                placeholder="Vui lòng mô tả chi tiết lý do bạn muốn trả hàng..."></textarea>
                                </div>

                                <!-- Tải ảnh minh chứng (Hỗ trợ nhiều ảnh) -->
                                <div class="mb-6">
                                        <label
                                                class="block text-body-sm font-bold text-carbon-ink mb-2">Ảnh
                                                minh chứng (Không bắt buộc, có
                                                thể chọn nhiều ảnh)</label>

                                        <!-- Nút chọn ảnh -->
                                        <label for="return-image-input"
                                                class="cursor-pointer inline-flex items-center justify-center px-4 py-2 border-2 border-dashed border-outline-variant rounded-lg bg-surface-bright hover:bg-surface-container transition-colors mb-3">
                                                <span
                                                        class="material-symbols-outlined text-outline mr-2">add_photo_alternate</span>
                                                <span
                                                        class="text-body-sm text-graphite font-medium">Chọn
                                                        ảnh</span>
                                        </label>
                                        <!-- Thêm thuộc tính 'multiple' để cho phép chọn nhiều tệp -->
                                        <input type="file"
                                                id="return-image-input"
                                                accept="image/*" multiple
                                                class="hidden"
                                                onchange="previewReturnImages(event)">

                                        <!-- Khu vực hiển thị danh sách ảnh xem trước -->
                                        <div id="return-image-preview-container"
                                                class="flex flex-wrap gap-3">
                                                <!-- Javascript sẽ tự động chèn các ảnh vào đây -->
                                        </div>
                                </div>

                                <!-- Nút Hành động -->
                                <div
                                        class="flex justify-end gap-3 border-t border-mist pt-4">
                                        <button onclick="closeReturnModal()"
                                                class="px-5 py-2 rounded-lg text-body-sm font-bold text-carbon-ink border border-outline-variant hover:bg-surface-container transition-colors">Hủy</button>
                                        <button
                                                onclick="submitReturnRequest(this)"
                                                class="px-5 py-2 rounded-lg text-body-sm font-bold text-paper-white bg-primary hover:bg-on-primary-fixed-variant transition-colors flex items-center justify-center gap-2">Gửi
                                                Yêu Cầu</button>
                                </div>
                        </div>
                </div>
        </body>
        <script src="assets/js/common.js"></script>
        <script src="assets/js/order.js"></script>
</html>
