                    <div class="flex flex-col gap-sm mb-lg">

                </section>
                <!-- Product Grid -->
                <section id="flash-sale-product-grid"
                    class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-gutter mb-xl">
