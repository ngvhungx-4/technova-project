<!-- Bong bóng nổi -->
<div id="compare-floating-bubble" onclick="expandCompare()"
    class="hidden fixed bottom-6 left-6 z-40 bg-surface-container-highest border border-primary/30 rounded-full w-14 h-14 shadow-2xl cursor-pointer hover:scale-110 transition-transform flex items-center justify-center group">
    <div class="relative flex items-center justify-center leading-none">
        <span
            class="material-symbols-outlined text-primary text-[32px] group-hover:animate-pulse">compare</span>
        <span id="compare-bubble-count"
            class="absolute -top-1.5 -right-2.5 bg-flash-sale-red text-white text-[11px] font-bold w-[22px] h-[22px] flex items-center justify-center rounded-full border-2 border-surface-container-highest leading-none tracking-tighter">0</span>
    </div>
</div>

<!-- Popup Tìm kiếm sản phẩm để So sánh -->
<div id="compare-search-modal"
    class="hidden fixed inset-0 z-[60] flex items-center justify-center p-4">
    <div class="absolute inset-0 bg-black/60 backdrop-blur-sm"
        onclick="closeCompareSearch()"></div>
    <div
        class="relative bg-surface-container-high border border-primary/30 rounded-2xl w-full max-w-2xl flex flex-col shadow-2xl overflow-hidden">
        <div class="p-6 border-b border-white/10 bg-surface/50">
            <div class="flex items-center justify-between mb-4">
                <h3
                    class="font-headline-md text-xl font-bold text-on-surface">Thêm
                    sản phẩm so sánh</h3>
                <button onclick="closeCompareSearch()"
                    class="w-8 h-8 rounded-full bg-white/5 hover:bg-white/10 flex items-center justify-center text-on-surface-variant transition-colors">
                    <span
                        class="material-symbols-outlined text-[20px]">close</span>
                </button>
            </div>
            <div class="relative">
                <span
                    class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant">search</span>
                <input type="text" id="compare-search-input"
                    onkeyup="debounceCompareSearch(event)"
                    placeholder="Nhập tên sản phẩm (VD: Alienware, Asus...)"
                    class="w-full bg-zinc-900 border border-white/10 rounded-xl py-3 pl-12 pr-4 text-body-base text-on-surface focus:border-primary focus:ring-1 focus:ring-primary transition-all placeholder:text-on-surface-variant/50 outline-none">
            </div>
        </div>
        <div id="compare-search-results"
            class="p-6 overflow-y-auto max-h-[50vh] custom-scrollbar bg-surface-container-highest">
            <div
                class="text-center text-on-surface-variant text-sm py-12 flex flex-col items-center">
                <span
                    class="material-symbols-outlined text-5xl mb-2 opacity-30">manage_search</span>
                Gõ tên sản phẩm để tìm kiếm...
            </div>
        </div>
    </div>
</div>

<!-- Compare Bar (Thanh so sánh) -->
<div
    class="fixed bottom-0 left-0 right-0 z-50 translate-y-full opacity-0 hidden transition-all duration-300 ease-in-out"
    id="compare-bottom-modal">
    <div
        class="bg-surface-container-highest border-t border-primary/30 shadow-[0_-8px_30px_rgba(0,0,0,0.5)]">
        <div class="max-w-container-max mx-auto px-gutter py-4">
            <div
                class="flex flex-col md:flex-row items-center justify-between gap-6">
                <div
                    class="flex md:flex-col items-center md:items-start justify-between w-full md:w-auto gap-2">
                    <h3
                        class="font-bold text-on-surface flex items-center gap-2">
                        <span
                            class="material-symbols-outlined text-primary">compare</span>
                        <span id="compare-title-count">So sánh sản phẩm
                            (0/3)</span>
                    </h3>
                    <div class="flex gap-4 items-center">
                        <button onclick="clearCompare()"
                            class="text-body-sm text-on-surface-variant hover:text-primary transition-colors underline decoration-dashed underline-offset-4">Xóa
                            tất cả</button>
                        <button onclick="collapseCompare()"
                            class="md:hidden text-on-surface-variant hover:text-on-surface"><span
                                class="material-symbols-outlined">close</span></button>
                    </div>
                </div>
                <div id="compare-slots-container"
                    class="flex gap-4 flex-grow w-full md:w-auto overflow-x-auto pb-2 md:pb-0 custom-scrollbar justify-center"></div>
                <div class="flex-shrink-0 flex items-center gap-4">
                    <button id="btn-go-compare" onclick="goToCompare()"
                        class="px-6 py-3 bg-zinc-800 text-on-surface-variant rounded-lg font-bold cursor-not-allowed border border-white/5"
                        disabled>So sánh ngay</button>
                    <button onclick="collapseCompare()"
                        class="hidden md:flex w-10 h-10 rounded-full bg-surface-container hover:bg-white/10 items-center justify-center text-on-surface-variant transition-colors"><span
                            class="material-symbols-outlined">close</span></button>
                </div>
            </div>
        </div>
    </div>
</div>
